name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import requests, os, re
          
          def get_d(urls, pattern=None, limit=5):
              combined = []
              for u in urls:
                  try:
                      r = requests.get(u, timeout=15)
                      if r.status_code == 200:
                          if pattern:
                              matches = re.findall(pattern, r.text)
                              combined.extend(matches)
                          else:
                              lines = [l.strip() for l in r.text.splitlines() if len(l) > 15]
                              combined.extend(lines)
                  except: pass
              return list(dict.fromkeys(combined))[:limit]

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          
          # НОВЫЕ ЖИВЫЕ ИСТОЧНИКИ
          # HTTP
          h = get_d(["https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt", "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"], limit=10)
          
          # VLESS / TROJAN / SS (Агрегаторы)
          v = get_d([
              "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt",
              "https://raw.githubusercontent.com/LonUp/NodeList/main/NodeList.txt",
              "https://raw.githubusercontent.com/awesome-vpn/vpn-configs/main/all.txt"
          ], limit=5)
          
          # MTPROTO (Поиск ссылок tg://proxy через регулярку)
          m = get_d([
              "https://raw.githubusercontent.com/FidS6/MTProto-Proxy/main/mtproto.txt",
              "https://raw.githubusercontent.com/TelegramProxy/ProxyList/main/MTProto.txt"
          ], pattern=r"https://t\.me/proxy\?server=[^\s]+", limit=5)

          msg = "💎 **PREMIUM PROXY BUNDLE** 💎\n\n"
          
          msg += "🌐 **HTTP/S (Tap to copy):**\n" + "\n".join([f"`{p}`" for p in h]) + "\n\n"
          
          msg += "🔐 **VLESS/V2RAY (Tap to copy):**\n"
          if v:
              for i, link in enumerate(v): msg += f"🔗 Node {i+1}:\n`{link}`\n\n"
          else: msg += "⚠️ Конфиги VLESS временно обновляются...\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if m:
              for i, proxy in enumerate(m): msg += f"🔹 [Рабочий прокси {i+1}]({proxy})\n"
          else:
              msg += "🔗 [Connect Default](https://t.me/proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", 
                        data={"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": True})
        shell: python
