name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36',
                      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем с внешнего API Proxyscrape
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS - Идем на freevpnkeys и другие НЕ GitHub ресурсы
          # Мы заходим на страницы локаций, где лежат сами ключи
          v_urls = [
              "https://freevpnkeys.com/vless/",
              "https://freevpnkeys.com/vmess/",
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/vless_v2rayng",
              "https://vless.at.ua/index/0-2" # Старый, но живучий сайт-агрегатор
          ]
          
          v_all = ""
          for url in v_urls:
              v_all += get_web(url)
          
          # Ищем ссылки и чистим их от HTML-мусора
          raw_v = re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+)", v_all)
          v_clean = []
          for link in raw_v:
              # Обрезаем все, что может приклеиться из HTML тегов
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 100: # Рабочий VLESS всегда длинный
                  v_clean.append(clean)

          v_final = list(dict.fromkeys(v_clean))
          random.shuffle(v_final)
          v_final = v_final[:5]

          # 3. MTPROTO - Только через веб-зеркала Телеграм (т.к. они работают)
          m_urls = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto", "https://t.me/s/MypublicProxy"]
          m_all = ""
          for url in m_urls:
              m_all += get_web(url)
          
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🔌 **NON-STOP PROXY REFRESH** 🔌\n\n"
          
          msg += "🌐 **HTTP/S (Working):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Ошибка API"

          msg += "\n\n🔐 **VLESS / VMESS (From Web):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Конфиги обновляются на сайте...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"💎 [Connect Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Emergency Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
