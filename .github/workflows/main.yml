name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def fetch_vless():
              # Используем агрегаторы, которые собирают данные из сотен каналов
              urls = [
                  "https://vfarid.github.io/v2ray-worker-sub/sub/shadowrocket", # Стабильный агрегатор
                  "https://raw.githubusercontent.com/w1770946466/Auto_Proxy/main/Long_term_subscription_num"
              ]
              combined = ""
              for url in urls:
                  try:
                      req = urllib.request.Request(f"{url}?t={time.time()}")
                      req.add_header('User-Agent', 'Mozilla/5.0')
                      with urllib.request.urlopen(req, timeout=15) as r:
                          combined += r.read().decode('utf-8', errors='ignore')
                  except: continue
              
              # Ищем ссылки vless/vmess/ss/trojan
              found = re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+|trojan://[^\s#]+)", combined)
              return list(set(found))

          def fetch_mtproto():
              # Берем напрямую из веб-версий агрегаторов
              urls = [
                  "https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies",
                  "https://api.clashnode.com/proxy/mtproto" 
              ]
              combined = ""
              for url in urls:
                  try:
                      req = urllib.request.Request(f"{url}?t={time.time()}")
                      req.add_header('User-Agent', 'Mozilla/5.0')
                      with urllib.request.urlopen(req, timeout=15) as r:
                          combined += r.read().decode('utf-8', errors='ignore')
                  except: continue
              return list(set(re.findall(r"tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*", combined)))

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP (через API Proxyscrape, чтобы всегда разные)
          h_raw = ""
          try:
              h_raw = urllib.request.urlopen("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000").read().decode()
          except: pass
          h_list = re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS
          v_list = fetch_vless()
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTProto
          m_list = fetch_mtproto()
          random.shuffle(m_list)
          m_final = m_list[:5]

          msg = "⚙️ **EXPERIMENTAL PROXY ENGINE** ⚙️\n\n"
          
          msg += "🌐 **HTTP/S (Fresh):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ No HTTP"
          
          msg += "\n\n🔐 **VLESS / VMESS / TROJAN:**\n"
          if v_final:
              for i, l in enumerate(v_final): msg += f"🚀 `{l[:50]}...` [Copy]({l})\n\n"
          else: msg += "⚠️ Sources blocked by GitHub\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if m_final:
              for i, l in enumerate(m_final): msg += f"🔹 [Link {i+1}]({l})\n"
          else:
              msg += "🔹 [Emergency Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
