name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/110.0.0.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - берем из внешнего API (не GitHub)
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS/VMESS - парсим веб-зеркала Telegram и внешние подписки
          v_raw = get_web("https://t.me/s/v2rayng_v") # Веб-зеркало канала
          v_raw += get_web("https://vless.at.ua/index/0-2") # Внешний сайт
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+)", v_raw)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - парсим веб-зеркала TG-каналов с прокси
          m_raw = get_web("https://t.me/s/ProxyMTProto") 
          m_raw += get_web("https://t.me/s/TelMTProto")
          m_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_raw)))
          random.shuffle(m_list)
          m_final = m_list[:5]

          msg = "🛰 **MULTI-SOURCE REFRESH** 🛰\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"
          
          msg += "\n\n🔐 **VLESS / VMESS / SS:**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{l[:60]}...` \n[🔗 LINK]({l})\n\n"
          else:
              msg += "⚠️ Нет свежих узлов в TG\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if m_final:
              for i, l in enumerate(m_final):
                  msg += f"🔹 [Connect Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
