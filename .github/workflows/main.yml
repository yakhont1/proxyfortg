name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi-Source Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import urllib.parse
          import re
          import os
          import random
          import time

          # 1. Сбор свежих SOCKS5 (Чистый IP:PORT)
          sources = [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt",
              "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt",
              "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-socks5.txt"
          ]

          fresh_pool = []
          for url in sources:
              try:
                  req = urllib.request.Request(url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read().decode('utf-8').splitlines()
                      clean_lines = [l.strip() for l in content if l.strip() and ":" in l]
                      fresh_pool.extend(clean_lines[:15])
              except Exception as e:
                  print(f"Error fetching SOCKS5: {e}")

          fresh_pool = list(dict.fromkeys(fresh_pool))
          v_final = []
          if fresh_pool:
              count_to_take = min(4, len(fresh_pool))
              v_final = random.sample(fresh_pool, count_to_take)

          # 2. Сбор MTProto (Оригинальный простой метод)
          mt_final = []
          raw_mt_links = []
          mt_sources = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          
          for web_url in mt_sources:
              try:
                  req = urllib.request.Request(web_url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      web_data = r.read().decode('utf-8')
                      
                      # Находим ссылки, учитывая возможный &amp; в разметке Телеграма
                      links = re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", web_data)
                      raw_mt_links.extend(links)
              except Exception as e:
                  print(f"Error fetching MTProto: {e}")

          # Очищаем ссылки от дубликатов и исправляем &amp; обратно на &
          seen_mt = set()
          clean_mt = []
          for link in raw_mt_links:
              # Вычищаем HTML-код амперсанда, делая ссылку полностью рабочей
              normalized = link.replace("&amp;", "&").strip()
              
              # Срезаем случайный мусор на конце, если регулярка захватила лишний символ
              if normalized.endswith(('"', "'", ")", ">", ";")):
                  normalized = normalized[:-1]
                  
              if normalized not in seen_mt and "secret=" in normalized:
                  seen_mt.add(normalized)
                  clean_mt.append(normalized)

          # Свежие посты идут внизу страницы, переворачиваем список
          clean_mt.reverse()
          mt_final = clean_mt[:5]

          # 3. Формируем сообщение (Без дублирования шапки)
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **SOCKS5 NODES (Universal)**\n"
          msg += "Tap to copy individual node\n"
          msg += "Нажмите, чтобы скопировать ключ\n"
          
          if v_final:
              for i, proxy in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{proxy}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "**Stable access / Стабильный доступ**\n"
          
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          else:
              msg += "⚠️ *MTProto rotation... / Прокси обновляются...*\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          # 4. Отправка в Telegram
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
