name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def fetch(url):
              try:
                  # Добавляем рандомный заголовок и метку времени
                  req = urllib.request.Request(f"{url}&t={int(time.time())}" if "?" in url else f"{url}?t={int(time.time())}")
                  req.add_header('User-Agent', f'Mozilla/5.0 (Windows NT 10.0; Win64; x64) {random.random()}')
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем через API (всегда разные)
          h_raw = fetch("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all")
          h_list = re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS / SS - Используем агрегаторы, которые выдают готовые ссылки
          # Эти ссылки ведут на динамические подписки, которые обновляются ежеминутно
          v_api = [
              "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/sarat_fess/v2ray-worker/master/sub/sub.txt"
          ]
          v_all = ""
          for url in v_api: v_all += fetch(url)
          
          # Ищем все типы конфигов
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+|trojan://[^\s#]+)", v_all)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Используем официальные каналы-агрегаторы через веб-интерфейс
          # Парсим напрямую из публичных списков
          mt_sources = [
              "https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies"
          ]
          mt_all = ""
          for url in mt_sources: mt_all += fetch(url)
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*", mt_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🌟 **ELITE PROXY REFRESH** 🌟\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Обновление..."
          
          msg += "\n\n🔐 **VLESS / VMESS / TROJAN (Top 5):**\n"
          if v_final:
              for i, l in enumerate(v_final): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "⚠️ Конфиги обновляются, попробуйте позже\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, l in enumerate(mt_final):
                  msg += f"🔹 [Подключить прокси {i+1}]({l})\n"
          else:
              msg += "🔹 [Запасной MTProto](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка в Telegram
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
