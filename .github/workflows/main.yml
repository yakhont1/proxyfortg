name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP/S
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_final = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))[:5]

          # 2. VLESS & TROJAN (Берем из независимых источников)
          v_sources = [
              "https://sub.shz.al/v2ray", # Агрегатор (не GitHub)
              "https://t.me/s/v2rayng_v",   # Зеркало TG
              "https://t.me/s/v2ray_custom" # Зеркало TG
          ]
          
          v_combined = "".join([get_web(s) for s in v_sources])
          p_links = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", v_combined)
          
          p_clean = []
          for link in p_links:
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 80:
                  p_clean.append(clean)

          p_final = list(dict.fromkeys(p_clean))
          random.shuffle(p_final)
          p_final = p_final[:2] # Как ты и просил — только 2 лучших

          # 3. MTPROTO
          m_all = get_web("https://t.me/s/ProxyMTProto")
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🛰 **FINAL SURVIVAL REFRESH** 🛰\n\n"
          
          msg += "🌐 **HTTP/S (Working):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (Top 2):**\n"
          if p_final:
              for i, node in enumerate(p_final):
                  msg += f"🔥 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Поиск узлов...\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
