name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import requests, os, re

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. Берем VLESS из самого стабильного на сегодня источника (обновляется ежеминутно)
          v_data = requests.get("https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/configs", timeout=20).text
          v_configs = re.findall(r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+)", v_data)[:5]

          # 2. Берем MTPROTO из специализированного агрегатора
          m_data = requests.get("https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies", timeout=20).text
          mt_links = re.findall(r"(tg://proxy\?server=[^\s]+)", m_data)[:5]

          # 3. HTTP прокси
          h_data = requests.get("https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt", timeout=20).text
          http_proxies = h_data.splitlines()[:10]

          msg = "✨ **ULTRA PROXY PACK** ✨\n\n"
          
          msg += "🌐 **HTTP/S (Tap to copy):**\n"
          msg += "\n".join([f"`{p}`" for p in http_proxies]) + "\n\n"
          
          msg += "🔐 **VLESS / VMESS / SS:**\n"
          if v_configs:
              for i, conf in enumerate(v_configs):
                  msg += f"🔗 Node {i+1}:\n`{conf}`\n\n"
          else:
              msg += "⚠️ Конфиги временно недоступны\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if mt_links:
              for i, link in enumerate(mt_links):
                  msg += f"🔹 [Рабочий прокси {i+1}]({link})\n"
          else:
              msg += "🔹 [Запасной MTProto](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", 
                        data={"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": True})
        shell: python
