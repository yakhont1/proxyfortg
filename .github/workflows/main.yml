name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/115.0.0.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем через внешний API Proxyscrape (не GitHub)
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS / SS - Парсим веб-зеркала Telegram каналов
          # Это зеркала, которые показывают только последние сообщения (свежак)
          v_sources = [
              "https://t.me/s/v2ray_outline_vless",
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/vless_v2rayng"
          ]
          v_all = ""
          for s in v_sources: v_all += get_web(s)
          # Ищем конфиги, исключая мусорные символы в конце
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+)", v_all)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Парсим веб-зеркала топовых прокси-каналов
          m_sources = [
              "https://t.me/s/ProxyMTProto",
              "https://t.me/s/TelMTProto",
              "https://t.me/s/MypublicProxy"
          ]
          m_all = ""
          for s in m_sources: m_all += get_web(s)
          # Регулярка для Telegram прокси ссылок
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🔥 **FRESH PROXY UPDATE** 🔥\n"
          msg += "_(Source: TG Channels Mirror)_\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"
          
          msg += "\n\n🔐 **VLESS / VMESS (Top 5):**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{l[:55]}...` \n[🔗 CONNECT/COPY]({l})\n\n"
          else:
              msg += "⚠️ No fresh VLESS found in feeds\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, l in enumerate(mt_final):
                  msg += f"🔹 [Active Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Emergency Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
