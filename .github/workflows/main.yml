name: Update Proxy Checked

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request, socket, re, os, random, time

          def is_alive(proxy_str):
              try:
                  ip, port = proxy_str.split(':')
                  with socket.create_connection((ip, int(port)), timeout=3):
                      return True
              except: return False

          def get_content(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP + CHECKER
          h_raw = get_content("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_all = re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)
          random.shuffle(h_all)
          h_final = [p for p in h_all if is_alive(p)][:5]

          # 2. VLESS / VMESS / TROJAN
          # Берем из агрегаторов вне GitHub (через веб-зеркала)
          v_sources = [
              "https://vfarid.github.io/v2ray-worker-sub/sub/shadowrocket",
              "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt"
          ]
          v_data = "".join([get_content(s) for s in v_sources])
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#\"<]+|vmess://[^\s#\"<]+|ss://[^\s#\"<]+|trojan://[^\s#\"<]+)", v_data)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO + CHECKER (Базовая проверка порта)
          m_raw = get_content("https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies")
          m_all = list(dict.fromkeys(re.findall(r"tg://proxy\?server=([^\&]+)\&port=([^\&]+)\&secret=([^\s\&\"']+)", m_raw)))
          random.shuffle(m_all)
          m_final_links = []
          for server, port, secret in m_all:
              if len(m_final_links) >= 5: break
              if is_alive(f"{server}:{port}"):
                  m_final_links.append(f"tg://proxy?server={server}&port={port}&secret={secret}")

          msg = "🛡 **VERIFIED PROXY UPDATE** 🛡\n\n"
          msg += "🌐 **HTTP/S (Checked & Live):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ No live proxies found"
          
          msg += "\n\n🔐 **VLESS / VMESS / SS:**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{l[:55]}...` \n[🔗 LINK]({l})\n\n"
          else: msg += "⚠️ Searching fresh nodes...\n\n"

          msg += "🛡 **MTPROTO (Tested 5):**\n"
          if m_final_links:
              for i, l in enumerate(m_final_links):
                  msg += f"🔹 [Active Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Emergency](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          data = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=data)
        shell: python
