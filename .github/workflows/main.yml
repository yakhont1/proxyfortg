name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import base64
          import os
          import re

          def get_raw(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # Собираем VLESS/VMESS из подписок (часто они в Base64)
          v_raw = get_raw("https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/configs")
          if len(v_raw) > 100 and not v_raw.startswith("vless"):
              try: v_raw = base64.b64decode(v_raw).decode('utf-8')
              except: pass
          
          v_list = re.findall(r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+|trojan://[^\s]+)", v_raw)[:5]

          # Собираем MTPROTO (используем другой проверенный агрегатор)
          m_raw = get_raw("https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies")
          mt_list = re.findall(r"(tg://proxy\?server=[^\s]+)", m_raw)[:5]

          # HTTP
          h_raw = get_raw("https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt")
          h_list = h_raw.splitlines()[:10]

          msg = "🌟 **ELITE PROXY REFRESH** 🌟\n\n"
          msg += "🌐 **HTTP/S (Tap to copy):**\n" + "\n".join([f"`{p}`" for p in h_list]) + "\n\n"
          
          msg += "🔐 **VLESS / VMESS / TROJAN:**\n"
          if v_list:
              for i, l in enumerate(v_list): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "❌ Nodes not found\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if mt_list:
              for i, l in enumerate(mt_list): msg += f"🔹 [Active Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Digital Resistance](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка через urllib (чтобы не зависеть от requests)
          data = urllib.parse.urlencode({
              "chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"
          }).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=data)
        shell: python
