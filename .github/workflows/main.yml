name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. Fetching MTProto Links
          m_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. V2Ray (VLESS/VMESS) from Eternity Aggregator
          v_raw = get_web("https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity")
          v_final = []
          try:
              decoded_data = base64.b64decode(v_raw).decode('utf-8', errors='ignore')
              # Ищем vless, vmess, trojan
              v_links = re.findall(r"((?:vless|vmess|trojan)://[^\s<\"'#]+)", decoded_data)
              # Фильтруем слишком короткие или битые ссылки
              v_links = [l for l in v_links if len(l) > 50]
              random.shuffle(v_links)
              v_final = v_links[:2]
          except:
              pass

          # Building the Bilingual Post
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          # Section: V2Ray
          msg += "⚡️ **V2RAY NODES (VLESS / VMESS)**\n"
          msg += "*Tap to copy individual node*\n"
          msg += "*Нажмите, чтобы скопировать ключ*\n"
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          # Section: MTProto
          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "*Stable access / Стабильный доступ*\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({
              "chat_id": c, 
              "text": msg, 
              "parse_mode": "Markdown", 
              "disable_web_page_preview": "True"
          }).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
