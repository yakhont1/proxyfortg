name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/115.0.0.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Оставляем как есть (работает)
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS / SS - Берем с твоего нового источника + TG
          v_sources = [
              "https://freevpnkeys.com/vless/", 
              "https://freevpnkeys.com/vmess/",
              "https://t.me/s/v2rayng_v"
          ]
          v_all = "".join([get_web(s) for s in v_sources])
          # Ищем ссылки (vless, vmess, ss)
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+|trojan://[^\s<\"'#]+)", v_all)))
          # Оставляем только те, что длиннее 60 символов (реальные ключи)
          v_list = [v for v in v_list if len(v) > 60]
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Оставляем как есть (работает)
          m_sources = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          m_all = "".join([get_web(s) for s in m_sources])
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "💎 **ELITE PROXY & VPN PACK** 💎\n\n"
          
          msg += "🌐 **HTTP/S (Fresh):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / VMESS (New Source):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  # Публикуем целиком в блоке кода
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Конфиги обновляются...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Рабочий Прокси {i+1}]({link})\n"
          else:
              msg += "🔹 [Запасной вариант](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
