name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_raw(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/110.0.0.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Всегда рабочие из проверенного API
          h_data = get_raw("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_data)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS - Берем из агрегатора, который GitHub точно видит
          # Мы берем raw-ссылку, которая обновляется автоматически
          v_raw = get_raw("https://raw.githubusercontent.com/V2Ray-CONFIG/V2RAY-CONFIG/main/All_Configs_Sub.txt")
          # Если там Base64 (частая тема), декодируем
          if v_raw and not v_raw.startswith("vless"):
              try: v_raw = base64.b64decode(v_raw).decode('utf-8')
              except: pass
          
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#\"<]+|vmess://[^\s#\"<]+|ss://[^\s#\"<]+|trojan://[^\s#\"<]+)", v_raw)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Меняем источники на те, где прокси живут долго
          mt_sources = [
              "https://raw.githubusercontent.com/discord-is-cool/mtproto-proxy-list/main/proxies.txt",
              "https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies"
          ]
          m_all = ""
          for s in mt_sources: m_all += get_raw(s)
          m_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(m_list)
          m_final = m_list[:5]

          msg = "💎 **ELITE PROXY UPDATE** 💎\n\n"
          
          msg += "🌐 **HTTP/S (Fresh):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Обновление..."
          
          msg += "\n\n🔐 **VLESS / VMESS (Top 5):**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{l[:60]}...` \n[🔗 Скопировать]({l})\n\n"
          else:
              msg += "⚠️ Конфиги скоро будут доступны\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if m_final:
              for i, l in enumerate(m_final):
                  msg += f"🔹 [Рабочий прокси {i+1}]({l})\n"
          else:
              msg += "🔹 [Запасной MTProto](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
