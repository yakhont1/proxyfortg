name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import requests, os
          def get_d(u):
              try:
                  r = requests.get(u, timeout=15)
                  if r.status_code == 200:
                      return [l.strip() for l in r.text.splitlines() if len(l) > 10][:5]
                  return []
              except: return []
          
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          if not t or not c: exit(1)

          h = get_d("https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt")
          v = get_d("https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt")
          
          msg = "🔥 **NEW MEGA LIST** 🔥\n\n🌐 **HTTP/S (Tap to copy):**\n"
          msg += "\n".join([f"`{p}`" for p in h]) if h else "Updating..."
          
          msg += "\n\n🔐 **VLESS/V2RAY (Tap to copy):**\n"
          if v:
              for i, l in enumerate(v): msg += f"🔗 Link {i+1}:\n`{l}`\n"
          else: msg += "Searching for links..."
          
          msg += "\n\n🛡 **MTPROTO:**\n🔗 [Connect Proxy](https://t.me/proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"
          
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", 
                        data={"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": True})
        shell: python
