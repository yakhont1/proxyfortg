name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os

          def get_data(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP (ровно 5)
          h_raw = get_data("https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt")
          h_list = re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)[:5]

          # 2. VLESS/VMESS (5 штук) - используем агрегаторы, которые редко банят
          v_sources = [
              "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt",
              "https://raw.githubusercontent.com/vfarid/v2ray-worker/master/sub/sub.txt",
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray.txt"
          ]
          v_all = ""
          for s in v_sources: v_all += get_data(s)
          v_list = re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+|trojan://[^\s#]+)", v_all)[:5]

          # 3. MTPROTO (5 штук) - берем из живых баз
          m_sources = [
              "https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies",
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies"
          ]
          m_all = ""
          for s in m_sources: m_all += get_data(s)
          mt_links = re.findall(r"(tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*)", m_all)[:5]

          msg = "🚀 **REAL-TIME PROXY UPDATE** 🚀\n\n"
          
          msg += "🌐 **HTTP/S (Top 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_list]) if h_list else "❌ Offline"
          
          msg += "\n\n🔐 **VLESS / VMESS / SS (Top 5):**\n"
          if v_list:
              for i, l in enumerate(v_list): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "⚠️ Searching for nodes...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_links:
              for i, l in enumerate(mt_links):
                  msg += f"🔹 [Active Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка через API
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
