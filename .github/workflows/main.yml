name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import json
          import time

          def get_web(url, is_json=False):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = r.read().decode('utf-8', errors='ignore')
                      return json.loads(data) if is_json else data
              except: return None

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTProto
          m_all = (get_web("https://t.me/s/ProxyMTProto") or "") + (get_web("https://t.me/s/TelMTProto") or "")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_all)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. V2Ray через GitHub API
          v_final = []
          # Запрашиваем список файлов в папке configs через API
          api_url = "https://api.github.com/repos/Epodonios/v2ray-configs/contents/configs"
          files_data = get_web(api_url, is_json=True)
          
          if files_data:
              # Собираем все имена файлов subXXX.txt
              file_names = [f['name'] for f in files_data if f['name'].startswith('sub') and f['name'].endswith('.txt')]
              # Извлекаем числа из имен
              nums = []
              for name in file_names:
                  match = re.search(r'sub(\d+)\.txt', name)
                  if match: nums.append(int(match.group(1)))
              
              if nums:
                  # Берем самый большой номер
                  last_num = max(nums)
                  # Пробуем загрузить этот файл (RAW версия)
                  raw_url = f"https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/configs/sub{last_num}.txt?t={int(time.time())}"
                  content = get_web(raw_url)
                  
                  if content:
                      links = re.findall(r"((?:vless|vmess|trojan|ss)://[^\s<\"'#]+)", content)
                      if links:
                          # Берем 2 первых (самых свежих внутри файла)
                          v_final = links[:2]

          # Формирование сообщения
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          msg += "⚡️ **V2RAY NODES (VLESS / VMESS)**\n"
          msg += "*Latest verified nodes via GitHub API*\n"
          msg += "*Свежие узлы, найденные через API*\n"
          
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
