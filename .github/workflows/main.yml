name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP/S - Без изменений
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          h_final = h_list[:5]

          # 2. VLESS & TROJAN - С декодированием Base64
          v_sources = [
              "https://sub.shz.al/v2ray",
              "https://t.me/s/v2rayng_v",
              "https://vless.at.ua/index/0-2"
          ]
          
          v_raw_content = ""
          for s in v_sources:
              v_raw_content += get_web(s)
          
          # Пробуем найти ключи в чистом тексте И в Base64 (если страница закодирована)
          try:
              decoded = base64.b64decode(v_raw_content).decode('utf-8')
              v_raw_content += decoded
          except: pass

          found = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", v_raw_content)
          v_clean = []
          for link in found:
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 80:
                  v_clean.append(clean)

          v_final = list(dict.fromkeys(v_clean))
          random.shuffle(v_final)
          v_final = v_final[:2] # Оставляем 2 ключа

          # 3. MTPROTO - ИСПРАВЛЕННЫЙ ПАРСИНГ (с параметрами)
          # Берем полный хвост ссылки после server=
          m_all = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_list = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "⚡️ **ULTIMATE V2RAY REFRESH** ⚡️\n\n"
          
          msg += "🌐 **HTTP/S (Working):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (v2rayNG):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Нет свежих узлов. Обновление...\n\n"

          msg += "🛡 **MTPROTO (Telegram Links):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  # Теперь ссылка будет полной и рабочей
                  msg += f"🔹 [Connect Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Emergency Link](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
