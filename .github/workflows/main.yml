name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *' # Увеличили частоту до раза в 2 часа
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # Источники для VLESS/VMESS/SS
          v_sources = [
              "https://t.me/s/v2rayng_v", "https://t.me/s/vless_v2rayng", 
              "https://t.me/s/V2ray_Alpha", "https://t.me/s/v2ray_outline_vless",
              "https://t.me/s/Shadowsocks_v2ray"
          ]
          
          # Источники для MTPROTO
          m_sources = [
              "https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto",
              "https://t.me/s/MTProtoProxies", "https://t.me/s/MypublicProxy"
          ]

          # Собираем VLESS
          v_raw = "".join([get_web(s) for s in v_sources])
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+)", v_raw)))
          # Фильтр: оставляем только длинные (сложные) конфиги, они обычно рабочие
          v_list = [x for x in v_list if len(x) > 50]
          random.shuffle(v_list)
          v_final = v_list[:5]

          # Собираем MTPROTO
          m_raw = "".join([get_web(s) for s in m_sources])
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_raw)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "✨ **LATEST PROXY UPDATE (MAX FRESH)** ✨\n\n"
          
          msg += "🔐 **VLESS / VMESS / SS:**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"Node {i+1} (Tap to copy):\n`{node}`\n\n"
          else: msg += "❌ Нет свежих узлов\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if mt_final:
              for i, l in enumerate(mt_final):
                  msg += f"🔹 [Рабочий канал {i+1}]({l})\n"
          else: msg += "❌ Прокси не найдены"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
