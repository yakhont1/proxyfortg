name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 1. Запрашиваем живые SOCKS5 и ОЧИЩАЕМ от скрытых символов \r
          URL="https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=10000&country=all&ssl=all&anonymity=all"
          CONTENT=$(curl -sL --max-time 10 "${URL}" | tr -d '\r')
          
          # Берем 4 случайные строки
          SOCKS_RAW=$(echo "$CONTENT" | grep -E '^[0-9]' | shuf -n 4)

          # 2. Сбор MTPROTO (5 штук)
          MT_LINKS=$(curl -sL "https://t.me/s/ProxyMTProto" | grep -oP 'tg://proxy\?server=[^"&<> ]+' | shuf -n 5)

          # 3. Шапка сообщения
          MSG="ProXy Lists | VPN | Socks | MTProto%0A"
          MSG="${MSG}🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐%0A%0A"
          
          MSG="${MSG}⚡️ **SOCKS5 NODES (Universal)**%0A"
          MSG="${MSG}Tap to copy individual node%0A"
          MSG="${MSG}Нажмите, чтобы скопировать ключ%0A"

          # 4. Обрабатываем строки и создаем ссылки для TG
          if [ ! -z "$SOCKS_RAW" ]; then
            i=1
            while read -r line; do
              # Чистим строку на всякий случай еще раз
              clean_line=$(echo "$line" | xargs)
              if [ ! -z "$clean_line" ] && [[ "$clean_line" == *":"* ]]; then
                IP=$(echo "$clean_line" | cut -d':' -f1)
                PORT=$(echo "$clean_line" | cut -d':' -f2)
                
                TG_LINK="https://t.me/socks?server=${IP}&port=${PORT}"
                
                MSG="${MSG}🚀 Node $i:%0A\`${TG_LINK}\`%0A%0A"
                i=$((i+1))
              fi
            done <<< "$SOCKS_RAW"
          else
            MSG="${MSG}⚠️ Nodes rotation... / Узлы обновляются..%0A%0A"
          fi

          # 5. Блок MTPROTO
          MSG="${MSG}🔒 **MTPROTO (Telegram Direct)**%0A"
          MSG="${MSG}**Stable access / Стабильный доступ**%0A"
          
          if [ ! -z "$MT_LINKS" ]; then
            i=1
            while read -r line; do
              MSG="${MSG}🔹 Secure Access $i | [Подключить]($line)%0A"
              i=$((i+1))
            done <<< "$MT_LINKS"
          fi

          # 6. Подвал
          MSG="${MSG}%0A✨ **Status:** \`Operational / Работает\`%0A"
          MSG="${MSG}🕒 **Update:** \`Every 2 hours / Каждые 2 часа\`"

          # Отправка в Телеграм
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
