name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  # Имитируем мобильный Chrome, чтобы получить облегченную версию страниц
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTPROTO (Telegram) - Работает стабильно
          m_urls = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto", "https://t.me/s/MTProto_Proxy"]
          m_all = "".join([get_web(u) for u in m_urls])
          mt_final = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_all)))
          random.shuffle(mt_final)
          mt_final = mt_final[:5]

          # 2. VLESS / TROJAN - Собираем только из текстовых потоков (Raw Subscriptions)
          v_sources = [
              "https://sub.shz.al/v2ray",
              "https://t.me/s/v2ray_outline_vless",
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/v2ray_custom"
          ]
          
          v_data = "".join([get_web(s) for s in v_sources])
          # Ищем ключи, которые начинаются с протокола и имеют параметры безопасности
          found_keys = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", v_data)
          
          # Очистка и жесткий фильтр длины (короткие = битые)
          clean_v = []
          for k in found_keys:
              res = re.split(r'[<>"\'\s]', k)[0]
              if len(res) > 120: # Рабочий VLESS/Trojan всегда длинный из-за параметров
                  clean_v.append(res)

          v_final = list(dict.fromkeys(clean_v))
          random.shuffle(v_final)
          v_final = v_final[:2] # Оставляем 2 самых свежих

          # 3. HTTP/S
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))[:5]

          # Формируем сообщение
          msg = "✨ **FINAL STABLE UPDATE** ✨\n\n"
          
          msg += "🌐 **HTTP/S:**\n"
          msg += "\n".join([f"`{p}`" for p in h_list]) if h_list else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (v2rayNG):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Свободных узлов не найдено. Обновление через 2 часа.\n\n"

          msg += "🛡 **MTPROTO (Direct Links):**\n"
          for i, link in enumerate(mt_final):
              msg += f"🔹 [Connect Proxy {i+1}]({link})\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
