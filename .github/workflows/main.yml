name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run SOCKS5 Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 1. Загружаем список SOCKS5
          URL="https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt"
          # Добавляем метку времени для обхода кэша
          CONTENT=$(curl -sL "${URL}?t=$(date +%s)")

          if [ ! -z "$CONTENT" ]; then
            # 2. Берем 2 первых прокси
            TOP_2=$(echo "$CONTENT" | grep -E '^[0-9]' | head -n 2)
            
            # 3. Берем 2 последних прокси
            BOTTOM_2=$(echo "$CONTENT" | grep -E '^[0-9]' | tail -n 2)
            
            # Соединяем их
            FINAL_PROXIES="${TOP_2}"$'\n'"${BOTTOM_2}"
          fi

          # 4. MTProto (оставляем для стабильности)
          MT_LINKS=$(curl -sL "https://t.me/s/ProxyMTProto" | grep -oP 'tg://proxy\?server=[^"&<> ]+' | shuf -n 3)

          # Формируем сообщение
          MSG="🌐 **SOCKS5 & MTPROTO UPDATE** 🌐%0A%0A"
          
          MSG="${MSG}🧦 **SOCKS5 PROXY LIST**%0A"
          MSG="${MSG}*Top 2 and Bottom 2 from Proxifly*%0A"
          MSG="${MSG}*2 первых и 2 последних из списка*%0A%0A"

          if [ ! -z "$FINAL_PROXIES" ]; then
            while read -r line; do
              if [ ! -z "$line" ]; then
                MSG="${MSG}📍 \`$line\`%0A"
              fi
            done <<< "$FINAL_PROXIES"
          else
            MSG="${MSG}⚠️ SOCKS5 rotation... / Обновление...%0A"
          fi

          MSG="${MSG}%0A🔒 **MTPROTO (Telegram Direct)**%0A"
          if [ ! -z "$MT_LINKS" ]; then
            count=1
            while read -r line; do
              MSG="${MSG}🔹 [Secure Access $count]($line)%0A"
              count=$((count+1))
            done <<< "$MT_LINKS"
          fi

          MSG="${MSG}%0A✨ **Status:** \`Operational / Работает\`%0A"
          MSG="${MSG}🕒 **Update:** \`Every 2 hours / Каждые 2 часа\`"

          # Отправка в Телеграм
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
