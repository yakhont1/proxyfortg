name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTPROTO (Telegram) - всегда рабочие ссылки
          m_all = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_all)))
          random.shuffle(mt_links)

          # 2. VLESS & TROJAN (Берем из ПРЯМЫХ подписок, минуя сайты)
          raw_sources = [
              "https://raw.githubusercontent.com/freev2rayng/v2ray-subscription/main/v2ray.txt",
              "https://sub.shz.al/v2ray",
              "https://vless.at.ua/index/0-2"
          ]
          
          all_keys = ""
          for s in raw_sources:
              content = get_web(s)
              # Если контент в Base64 (часто для подписок), декодируем его
              try:
                  all_keys += base64.b64decode(content).decode('utf-8')
              except:
                  all_keys += content
          
          found = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", all_keys)
          v_final = []
          for link in found:
              res = re.split(r'[<>"\'\s]', link)[0]
              if len(res) > 100: # Отсекаем мусор
                  v_final.append(res)
          
          random.shuffle(v_final)
          v_final = v_final[:2] # Оставляем 2 ключа

          # 3. HTTP/S
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http"))))[:5]

          msg = "💎 **HARDCORE PROXY REFRESH** 💎\n\n"
          
          msg += "🌐 **HTTP/S:**\n"
          msg += "\n".join([f"`{p}`" for p in h_list]) if h_list else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (v2rayNG):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🔥 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Прямые каналы заняты. Повтор через час.\n\n"

          msg += "🛡 **MTPROTO (Telegram Links):**\n"
          for i, link in enumerate(mt_links[:5]):
              msg += f"🔹 [Connect {i+1}]({link})\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
