name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os

          def get_proxies(urls, pattern):
              combined = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          content = r.read().decode('utf-8')
                          matches = re.findall(pattern, content)
                          combined.extend(matches)
                  except: continue
              return list(dict.fromkeys(combined))

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - берем ровно 5 штук
          http_raw = get_proxies(["https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt"], r"\d+\.\d+\.\d+\.\d+:\d+")
          http_list = http_raw[:5]

          # 2. VLESS/VMESS - ищем в живых источниках (5 штук)
          v_sources = [
              "https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray.txt",
              "https://raw.githubusercontent.com/vfarid/v2ray-worker/master/sub/sub.txt"
          ]
          v_list = get_proxies(v_sources, r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+)")[:5]

          # 3. MTPROTO - (5 штук)
          mt_sources = [
              "https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies",
              "https://raw.githubusercontent.com/mizane-mize/MTProto/main/MTProto.txt"
          ]
          mt_raw = get_proxies(mt_sources, r"(tg://proxy\?server=[^\s]+|https://t\.me/proxy\?server=[^\s]+)")
          mt_list = mt_raw[:5]

          msg = "✨ **PREMIUM PROXY PACK** ✨\n\n"
          
          msg += "🌐 **HTTP/S (Tap to copy):**\n"
          msg += "\n".join([f"`{p}`" for p in http_list]) if http_list else "🔄 Updating..."
          
          msg += "\n\n🔐 **VLESS / VMESS (Top 5):**\n"
          if v_list:
              for i, l in enumerate(v_list): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "❌ Nodes temporarily unavailable\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_list:
              for i, l in enumerate(mt_list):
                  clean = l.replace("https://t.me/proxy?", "tg://proxy?")
                  msg += f"🔹 [Active Proxy {i+1}]({clean})\n"
          else:
              msg += "🔹 [Backup MTProto](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          data = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=data)
        shell: python
