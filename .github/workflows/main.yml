name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def get_web(url):
              try:
                  # Обход кэша через метку времени
                  cache_buster = f"&t={int(time.time())}" if "?" in url else f"?t={int(time.time())}"
                  req = urllib.request.Request(url + cache_buster, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTProto Links
          m_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. V2Ray: Берем ПЕРВЫЕ 2 ссылки из файла
          v_final = []
          raw_url = "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          content = get_web(raw_url)
          
          if content:
              # Ищем все конфиги
              all_v_links = re.findall(r"((?:vless|vmess|trojan|ss)://[^\s<\"'#]+)", content)
              
              if all_v_links:
                  # Сохраняем порядок, но убираем дубликаты
                  seen = set()
                  unique_links = [x for x in all_v_links if not (x in seen or seen.add(x))]
                  
                  # Берем 2 САМЫЕ ПЕРВЫЕ ссылки
                  v_final = unique_links[:2]

          # Формирование поста
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **V2RAY NODES (VLESS / VMESS)**\n"
          msg += "*Latest nodes from top of the list*\n"
          msg += "*Последние узлы из начала списка*\n"
          
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
