name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time
          import base64

          def get_content(url):
              try:
                  req = urllib.request.Request(f"{url}&t={time.time()}" if "?" in url else f"{url}?t={time.time()}")
                  req.add_header('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/110.0.0.0')
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - используем гарантированно работающий API
          h_raw = get_content("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS/VMESS - пробуем метод декодирования подписок (более надежный)
          v_subs = [
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/yebekhe/TVC/main/feeds/v2ray/active"
          ]
          v_found = []
          for sub in v_subs:
              data = get_content(sub)
              if data:
                  # Пытаемся декодировать, если это base64, или берем как есть
                  try:
                      decoded = base64.b64decode(data).decode('utf-8')
                      v_found.extend(re.findall(r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+|trojan://[^\s]+)", decoded))
                  except:
                      v_found.extend(re.findall(r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+|trojan://[^\s]+)", data))
          
          random.shuffle(v_found)
          v_final = v_found[:5]

          # 3. MTPROTO - забираем из стабильного источника-агрегатора
          m_raw = get_content("https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies")
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*", m_raw)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "💎 **FINAL PROXY REFRESH** 💎\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Не удалось загрузить"
          
          msg += "\n\n🔐 **VLESS / VMESS / SS:**\n"
          if v_final:
              for i, l in enumerate(v_final): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "⚠️ Конфиги временно недоступны\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, l in enumerate(mt_final):
                  msg += f"🔹 [Подключить {i+1}]({l})\n"
          else:
              msg += "🔹 [Запасной прокси](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
