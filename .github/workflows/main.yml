name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi-Source Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import urllib.parse
          import re
          import os
          import random
          import time
          import html

          # 1. Сбор SOCKS5 (Твоя рабочая база)
          sources = [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt",
              "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt",
              "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-socks5.txt"
          ]

          fresh_pool = []
          for url in sources:
              try:
                  req = urllib.request.Request(url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read().decode('utf-8').splitlines()
                      clean_lines = [l.strip() for l in content if l.strip() and ":" in l]
                      fresh_pool.extend(clean_lines[:15])
              except Exception as e:
                  print(f"Error fetching SOCKS5: {e}")

          fresh_pool = list(dict.fromkeys(fresh_pool))
          v_final = []
          if fresh_pool:
              count_to_take = min(4, len(fresh_pool))
              v_final = random.sample(fresh_pool, count_to_take)

          # 2. Сбор MTProto ИЗ КНОПОК CONNECT (Без чтения кривого текста постов)
          mt_final = []
          try:
              m_data = ""
              for t_url in ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]:
                  nocache_url = t_url + f"?t={int(time.time())}"
                  req = urllib.request.Request(nocache_url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      m_data += r.read().decode('utf-8')
              
              # Вытаскиваем содержимое атрибутов href, где есть слово proxy?server=
              # Эта регулярка найдет ссылки и в формате /proxy? и в формате tg://proxy? или https://t.me/proxy?
              raw_hrefs = re.findall(r'href=["\']([^"\']*(?:proxy\?|proxy\?server=)[^"\']+)["\']', m_data)
              
              # Разворачиваем список, чтобы первыми обрабатывать самые свежие кнопки снизу страницы
              raw_hrefs.reverse()
              
              seen_servers = set()
              
              for link in raw_hrefs:
                  # Декодируем HTML амперсанды (&amp; -> &) и убираем лишние пробелы
                  clean_link = html.unescape(link).strip()
                  
                  # Приводим любой формат ссылки (относительный /proxy или t.me/proxy) к прямому tg://proxy?
                  if "proxy?" in clean_link:
                      query_part = clean_link.split("proxy?")[1]
                      norm = f"tg://proxy?{query_part}"
                  else:
                      continue
                      
                  # Срезаем случайный мусор с хвоста ссылки, если он туда попал
                  while norm.endswith(('"', "'", ")", ">", ";", ".", ",")):
                      norm = norm[:-1]
                      
                  if "server=" in norm and "port=" in norm and "secret=" in norm:
                      # Вытаскиваем домен/IP сервера для проверки на дубликаты
                      try:
                          parsed_query = urllib.parse.parse_qs(norm.split("?")[1])
                          srv = parsed_query['server'][0].strip().lower()
                          port = parsed_query['port'][0].strip()
                          sec = parsed_query['secret'][0].strip()
                          
                          # Фикс косяка админов: убираем точку на конце домена (rudomain.info. -> rudomain.info)
                          if srv.endswith('.'):
                              srv = srv[:-1]
                              
                          # Пересобираем ссылку заново, уже идеально чистую
                          final_link = f"tg://proxy?server={srv}&port={port}&secret={sec}"
                      except:
                          continue
                          
                      # Если этот сервер мы еще не добавляли — забираем в пак
                      if srv not in seen_servers:
                          seen_servers.add(srv)
                          mt_final.append(final_link)
                          
                      # Набрали 5 уникальных свежих ссылок из кнопок — финишируем
                      if len(mt_final) == 5:
                          break
          except Exception as e:
              print(f"MTProto href parsing error: {e}")

          # 3. Формируем сообщение
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **SOCKS5 NODES (Universal)**\n"
          msg += "Tap to copy individual node\n"
          msg += "Нажмите, чтобы скопировать ключ\n"
          
          if v_final:
              for i, proxy in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{proxy}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "**Stable access / Стабильный доступ**\n"
          
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          else:
              msg += "⚠️ *MTProto rotation... / Прокси обновляются...*\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          # 4. Отправка в Telegram
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
