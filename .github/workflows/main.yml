name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi-Source Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import urllib.parse
          import re
          import os
          import random
          import time

          # 1. Получаем свежие SOCKS5 из трех топ-источников
          sources = [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt",
              "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt",
              "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-socks5.txt"
          ]

          fresh_pool = []
          for url in sources:
              try:
                  req = urllib.request.Request(url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read().decode('utf-8').splitlines()
                      clean_lines = [l.strip() for l in content if l.strip() and ":" in l]
                      # Забираем первые 15 строк — самый свежак
                      fresh_pool.extend(clean_lines[:15])
              except Exception as e:
                  print(f"Error fetching SOCKS5 from {url}: {e}")

          # Удаляем дубликаты
          fresh_pool = list(dict.fromkeys(fresh_pool))

          # Выбираем 4 случайных прокси из свежего пула
          v_final = []
          if fresh_pool:
              count_to_take = min(4, len(fresh_pool))
              v_final = random.sample(fresh_pool, count_to_take)

          # 2. Получаем САМЫЕ СВЕЖИЕ MTProto через RSS-ленту каналов (гарантия новизны)
          mt_final = []
          mt_sources = [
              "https://tgprog.com/channel/rss/ProxyMTProto/",
              "https://tgprog.com/channel/rss/TelMTProto/"
          ]
          
          raw_mt_links = []
          for rss_url in mt_sources:
              try:
                  req = urllib.request.Request(rss_url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      rss_data = r.read().decode('utf-8')
                      # Ищем ссылки внутри CDATA и текста публикаций
                      links = re.findall(r"(tg://proxy\?server=[^\s\"'<>&\s]+)", rss_data)
                      raw_mt_links.extend(links)
              except Exception as e:
                  print(f"Error fetching MTProto RSS from {rss_url}: {e}")

          # Если RSS подвел, пробуем стандартный веб-метод как запасной вариант
          if len(raw_mt_links) < 5:
              for web_url in ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]:
                  try:
                      req = urllib.request.Request(web_url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=10) as r:
                          web_data = r.read().decode('utf-8')
                          links = re.findall(r"(tg://proxy\?server=[^\s\"'<>&\s]+)", web_data)
                          raw_mt_links.extend(links)
                  except Exception as e:
                      print(f"Backup web fetch error for {web_url}: {e}")

          # Очищаем от дубликатов с сохранением порядка (свежие в начале)
          seen = set()
          clean_mt = []
          for link in raw_mt_links:
              # Убираем возможные дубликаты и битые символы на конце
              normalized = link.strip().replace("&amp;", "&")
              if normalized not in seen:
                  seen.add(normalized)
                  clean_mt.append(normalized)

          # Берем строго первые 5 самых новых прокси
          mt_final = clean_mt[:5]

          # 3. Формируем сообщение (Убрана дублирующая строка названия)
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **SOCKS5 NODES (Universal)**\n"
          msg += "Tap to copy individual node\n"
          msg += "Нажмите, чтобы скопировать ключ\n"
          
          if v_final:
              for i, proxy in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{proxy}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "**Stable access / Стабильный доступ**\n"
          
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          else:
              msg += "⚠️ *MTProto rotation... / Прокси обновляются...*\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          # 4. Отправка в Telegram
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
