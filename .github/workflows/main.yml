name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os

          def get_proxies(urls, pattern):
              combined = []
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          content = r.read().decode('utf-8')
                          matches = re.findall(pattern, content)
                          combined.extend(matches)
                  except: continue
              # Убираем дубликаты и пустые строки
              return list(dict.fromkeys([m.strip() for m in combined if m]))

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем ровно 5 штук
          http_urls = ["https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt", 
                       "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"]
          http_list = get_proxies(http_urls, r"\d+\.\d+\.\d+\.\d+:\d+")[:5]

          # 2. VLESS/VMESS - 5 штук
          v_urls = ["https://raw.githubusercontent.com/Alvin9999/new-pac/master/v2ray.txt",
                    "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt"]
          v_list = get_proxies(v_urls, r"(vless://[^\s]+|vmess://[^\s]+|ss://[^\s]+|trojan://[^\s]+)")[:5]

          # 3. MTPROTO - 5 штук
          mt_urls = ["https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies",
                     "https://raw.githubusercontent.com/mizane-mize/MTProto/main/MTProto.txt"]
          mt_raw = get_proxies(mt_urls, r"(tg://proxy\?server=[^\s]+|https://t\.me/proxy\?server=[^\s]+)")
          mt_list = mt_raw[:5]

          msg = "✨ **PREMIUM PROXY PACK** ✨\n\n"
          
          msg += "🌐 **HTTP/S (Top 5):**\n"
          msg += "\n".join([f"`{p}`" for p in http_list]) if http_list else "🔄 Обновление..."
          
          msg += "\n\n🔐 **VLESS / VMESS / TROJAN:**\n"
          if v_list:
              for i, l in enumerate(v_list): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else:
              msg += "❌ Конфиги не найдены\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_list:
              for i, l in enumerate(mt_list):
                  # Принудительно делаем ссылку в формате tg://
                  clean = l.replace("https://t.me/proxy?", "tg://proxy?")
                  msg += f"🔹 [Рабочий прокси {i+1}]({clean})\n"
          else:
              msg += "🔹 [Запасной MTProto](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка через API Telegram
          params = urllib.parse.urlencode({
              "chat_id": c, 
              "text": msg, 
              "parse_mode": "Markdown", 
              "disable_web_page_preview": "True"
          }).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
