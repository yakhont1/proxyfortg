name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTProto Links (Стабильные источники)
          m_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. V2Ray: Поиск САМОГО НОВОГО файла sub*.txt
          v_final = []
          # Заходим на страницу репозитория, чтобы увидеть список файлов
          repo_page = get_web("https://github.com/Epodonios/v2ray-configs/tree/main/configs")
          
          # Ищем все упоминания subXXX.txt
          file_numbers = re.findall(r"sub(\d+)\.txt", repo_page)
          
          if file_numbers:
              # Превращаем в числа и берем максимальное (последний файл)
              last_num = max(map(int, file_numbers))
              last_file_url = f"https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/configs/sub{last_num}.txt"
              
              # Качаем содержимое этого файла
              raw_content = get_web(last_file_url)
              v_links = re.findall(r"((?:vless|vmess|trojan|ss)://[^\s<\"'#]+)", raw_content)
              
              if v_links:
                  # Берем 2 случайных из этого файла
                  random.shuffle(v_links)
                  v_final = v_links[:2]

          # Формирование двуязычного поста
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **V2RAY NODES (VLESS / VMESS)**\n"
          msg += "*Tap to copy individual node*\n"
          msg += "*Нажмите, чтобы скопировать ключ*\n"
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "*Stable access / Стабильный доступ*\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({
              "chat_id": c, 
              "text": msg, 
              "parse_mode": "Markdown", 
              "disable_web_page_preview": "True"
          }).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
