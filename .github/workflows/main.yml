name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import time
          import random

          def get_fresh_data(urls):
              combined = ""
              for url in urls:
                  try:
                      # Добавляем метку времени, чтобы GitHub не выдавал старый кэш
                      fresh_url = f"{url}?t={int(time.time())}"
                      req = urllib.request.Request(fresh_url, headers={'User-Agent': f'Mozilla/5.0 {random.random()}'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          combined += r.read().decode('utf-8', errors='ignore') + "\n"
                  except: continue
              return combined

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем из 4 разных источников, чтобы не повторялись
          h_urls = [
              "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/http.txt",
              "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt",
              "https://api.proxyscrape.com/v2/?request=getproxies&protocol=http",
              "https://raw.githubusercontent.com/mmpx12/proxy-list/master/http.txt"
          ]
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", get_fresh_data(h_urls))))
          random.shuffle(h_list) # Перемешиваем, чтобы не были одними и теми же
          h_final = h_list[:5]

          # 2. VLESS/VMESS/SS - Новые агрегаторы
          v_urls = [
              "https://raw.githubusercontent.com/mueiba/V2Ray-Configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/Mizane-mize/V2Ray-Configs/main/Configs_Sub.txt",
              "https://raw.githubusercontent.com/yebekhe/TVC/main/feeds/v2ray/active"
          ]
          v_raw = get_fresh_data(v_urls)
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+)", v_raw)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Прямые ссылки
          mt_urls = [
              "https://raw.githubusercontent.com/MTProtoProxy/MTProtoProxy/master/proxy.txt",
              "https://raw.githubusercontent.com/yebekhe/TelegramVipProxy/main/proxies",
              "https://raw.githubusercontent.com/hookzof/socks5_list/master/tg/mtproto.txt"
          ]
          mt_raw = get_fresh_data(mt_urls)
          mt_list = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*)", mt_raw)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🔥 **ULTRA FRESH PROXY** 🔥\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ No HTTP found"
          
          msg += "\n\n🔐 **VLESS / VMESS (Random 5):**\n"
          if v_final:
              for i, l in enumerate(v_final): msg += f"🚀 Node {i+1}:\n`{l}`\n\n"
          else: msg += "⚠️ VLESS search failed...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, l in enumerate(mt_final):
                  msg += f"🔹 [Active Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Emergency Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
