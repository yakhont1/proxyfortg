name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 1. Получаем список файлов через простой текстовый интерфейс GitHub
          LIST_URL="https://github.com/Epodonios/v2ray-configs/tree/main/configs"
          
          # Находим все номера файлов и выбираем самый большой
          LAST_NUM=$(curl -sL $LIST_URL | grep -oP 'sub\K[0-9]+(?=\.txt)' | sort -n | tail -1)
          
          if [ -z "$LAST_NUM" ]; then
            # Если не нашли через парсинг, ставим проверенный вручную номер (на текущий момент)
            LAST_NUM=216 
          fi

          # 2. Скачиваем содержимое самого свежего файла
          RAW_URL="https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/configs/sub${LAST_NUM}.txt"
          CONTENT=$(curl -sL $RAW_URL)

          # 3. Вытаскиваем vless и vmess (берем первые 2 уникальных)
          V_LINKS=$(echo "$CONTENT" | grep -E '^(vless|vmess|trojan)://' | head -n 2)

          # 4. Собираем MTProto (как и раньше)
          MT_LINKS=$(curl -sL "https://t.me/s/ProxyMTProto" | grep -oP 'tg://proxy\?server=[^"&<> ]+' | head -n 3)

          # Формируем текст сообщения
          MSG="🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐%0A%0A"
          MSG="${MSG}⚡️ **V2RAY NODES (VLESS / VMESS)**%0A"
          MSG="${MSG}*Latest configs from sub${LAST_NUM}.txt*%0A"
          MSG="${MSG}*Свежие ключи из файла sub${LAST_NUM}.txt*%0A%0A"

          if [ ! -z "$V_LINKS" ]; then
            i=1
            while read -r line; do
              MSG="${MSG}🚀 Node $i:%0A\`$line\`%0A%0A"
              i=$((i+1))
            done <<< "$V_LINKS"
          else
            MSG="${MSG}⚠️ Nodes rotation... / Обновление...%0A%0A"
          fi

          MSG="${MSG}🔒 **MTPROTO (Telegram Direct)**%0A"
          if [ ! -z "$MT_LINKS" ]; then
            i=1
            while read -r line; do
              MSG="${MSG}🔹 [Secure Access $i]($line)%0A"
              i=$((i+1))
            done <<< "$MT_LINKS"
          fi

          MSG="${MSG}%0A✨ **Status:** \`Operational / Работает\`%0A"
          MSG="${MSG}🕒 **Update:** \`Every 2 hours / Каждые 2 часа\`"

          # Отправка в Телеграм
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
