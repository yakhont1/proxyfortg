name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. Fetching MTProto Links
          m_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. Fetching HTTP/S Proxies
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:8]

          # Building the Professional Post
          msg = "🌐 **GLOBAL PROXY NETWORK UPDATE** 🌐\n\n"
          
          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "*High-speed encryption for stable connection*\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1}]({link})\n"
          else:
              msg += "⚠️ *Scanning for active nodes...*\n"

          msg += "\n📡 **HTTP / HTTPS (Browsing)**\n"
          msg += "*Tap any proxy to copy it individually*\n"
          if h_final:
              # Wrapping each proxy in backticks for individual copying
              for p in h_final:
                  msg += f"`{p}`\n"
          else:
              msg += "❌ *Service temporarily offline*"

          msg += "\n✨ **Status:** `Operational`\n"
          msg += "🕒 **Next Refresh:** In 2 hours"

          params = urllib.parse.urlencode({
              "chat_id": c, 
              "text": msg, 
              "parse_mode": "Markdown", 
              "disable_web_page_preview": "True"
          }).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
