name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  # Имитируем реальный браузер более детально
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      'Referer': 'https://openkeys.net/'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Без изменений
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS - НОВЫЙ ИСТОЧНИК + ЛИМИТ 2 ШТУКИ
          v_sources = [
              "https://openkeys.net/protocols/vless/",
              "https://freevpnkeys.com/vless/",
              "https://t.me/s/v2rayng_v"
          ]
          
          v_all = ""
          for url in v_sources:
              v_all += get_web(url)
          
          # Ищем ключи. На openkeys они часто в атрибутах data-clipboard или внутри тегов
          raw_v = re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+)", v_all)
          
          v_clean = []
          for link in raw_v:
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 100:
                  v_clean.append(clean)

          v_final = list(dict.fromkeys(v_clean))
          random.shuffle(v_final)
          # ТУТ ОГРАНИЧЕНИЕ: Берем только 2 самых свежих/случайных
          v_final = v_final[:2]

          # 3. MTPROTO - Без изменений
          m_urls = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          m_all = "".join([get_web(url) for url in m_urls])
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "🛰 **TARGETED PROXY UPDATE** 🛰\n\n"
          
          msg += "🌐 **HTTP/S (Fresh):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS (Top 2 nodes):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Ключи на проверке...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
