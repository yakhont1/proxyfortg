name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import time

          # 1. Получаем SOCKS5 (2 первых и 2 последних)
          v_final = []
          try:
              url = "https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks5/data.txt"
              req = urllib.request.Request(url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  content = r.read().decode('utf-8').splitlines()
                  proxies = [l.strip() for l in content if l.strip()]
                  if len(proxies) >= 4:
                      v_final = [proxies[0], proxies[1], proxies[-2], proxies[-1]]
                  else:
                      v_final = proxies
          except: pass

          # 2. Получаем MTProto (5 штук)
          mt_final = []
          try:
              m_data = ""
              for t_url in ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]:
                  with urllib.request.urlopen(t_url, timeout=15) as r:
                      m_data += r.read().decode('utf-8')
              mt_final = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))[:5]
          except: pass

          # 3. Формируем сообщение СТРОГО по твоему рабочему шаблону
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **SOCKS5 NODES (Universal)**\n"
          msg += "Tap to copy individual node\n"
          msg += "Нажмите, чтобы скопировать ключ\n"
          
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "**Stable access / Стабильный доступ**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
