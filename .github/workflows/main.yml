name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def get_web(url, headers=None):
              if headers is None:
                  headers = {'User-Agent': 'Mozilla/5.0'}
              try:
                  # Сброс кэша
                  cache_buster = f"&t={int(time.time())}" if "?" in url else f"?t={int(time.time())}"
                  req = urllib.request.Request(url + cache_buster, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. MTProto (Берем из проверенных ТГ каналов)
          m_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", m_data)))
          random.shuffle(mt_links)
          mt_final = mt_links[:5]

          # 2. V2Ray: Ищем самый свежий файл subXXX.txt
          v_final = []
          # Парсим страницу со списком файлов напрямую
          files_list_page = get_web("https://github.com/Epodonios/v2ray-configs/tree/main/configs")
          # Ищем все номера файлов sub123.txt
          nums = re.findall(r"sub(\d+)\.txt", files_list_page)
          
          if nums:
              # Берем файл с максимальным номером
              max_num = max(map(int, nums))
              # Пробуем 3 последних файла на случай, если самый последний пустой
              for n in range(max_num, max_num - 3, -1):
                  raw_url = f"https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/configs/sub{n}.txt"
                  content = get_web(raw_url)
                  v_links = re.findall(r"((?:vless|vmess|trojan|ss)://[^\s<\"'#]+)", content)
                  if v_links:
                      # Берем 2 первых из САМОГО нового файла
                      v_final = v_links[:2]
                      break

          # Формирование поста
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          msg += "⚡️ **V2RAY NODES (VLESS / VMESS)**\n"
          msg += "*Verified fresh nodes from latest sub-files*\n"
          msg += "*Проверенные узлы из последних файлов подписок*\n"
          
          if v_final:
              for i, link in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{link}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
