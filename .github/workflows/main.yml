name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_web(url, timeout=20):
              try:
                  # Используем заголовки, чтобы не выглядеть как бот
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/123.0.0.0 Safari/537.36'
                  })
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP/S - Работает четко
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS - Агрегаторы, которые не блокируют GitHub
          v_sources = [
              "https://api.v1.mk/sub?target=v2ray&url=https://raw.githubusercontent.com/freevpnkeys/vless/main/vless.txt", # Конвертер в обход защиты
              "https://raw.fastgit.org/vfarid/v2ray-worker-sub/main/sub", # Зеркало вне основного домена GitHub
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/vless_v2rayng"
          ]
          
          v_combined = ""
          for s in v_sources:
              v_combined += get_web(s)
          
          # Пробуем декодировать, если пришел Base64
          try:
              decoded = base64.b64decode(v_combined).decode('utf-8')
              v_combined += decoded
          except: pass

          # Ищем ключи и фильтруем по качеству
          raw_v = re.findall(r"(vless://[^\s<\"'#]+|vmess://[^\s<\"'#]+|ss://[^\s<\"'#]+)", v_combined)
          v_clean = [v for v in raw_v if len(v) > 100 and (":443" in v or ":2053" in v or ":8443" in v)]
          
          # Если элитных (443 порт) мало, берем любые длинные
          if len(v_clean) < 2:
              v_clean = [v for v in raw_v if len(v) > 120]

          v_final = list(dict.fromkeys(v_clean))
          random.shuffle(v_final)
          v_final = v_final[:2] # Твой запрос: строго 2 ключа

          # 3. MTPROTO - Работает без сбоев
          m_urls = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          mt_all = "".join([get_web(u) for u in m_urls])
          mt_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", mt_all)))
          random.shuffle(mt_list)
          mt_final = mt_list[:5]

          msg = "✨ **PREMIUM SURVIVAL PACK** ✨\n\n"
          
          msg += "🌐 **HTTP/S (Working 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / VMESS (Top 2):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Прямые ссылки временно недоступны. Проверьте источники.\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Connect Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Backup Link](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
