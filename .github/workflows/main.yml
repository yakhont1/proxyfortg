name: Update Proxy

on:
  schedule:
    - cron: '0 */1 * * *' # Увеличим частоту до 1 раза в час
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  # Имитация реального браузера, чтобы не отлетать по 403
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/110.0.0.0 Safari/537.36'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. Прямой поиск ключей по агрегаторам (самый жир)
          # Эти ссылки отдают КЛЮЧИ ТЕКСТОМ, без защиты сайтов
          raw_urls = [
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/v2ray_custom",
              "https://t.me/s/V2Ray_Outline_Free",
              "https://sub.shz.al/v2ray",
              "https://raw.githubusercontent.com/freev2rayng/v2ray-subscription/main/v2ray.txt"
          ]
          
          all_text = ""
          for url in raw_urls:
              all_text += get_web(url)
          
          # Ищем VLESS и Trojan (от 100 символов, чтобы были полными)
          found = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", all_text)
          
          final_nodes = []
          for link in found:
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 100:
                  final_nodes.append(clean)
          
          final_nodes = list(dict.fromkeys(final_nodes))
          random.shuffle(final_nodes)
          v_res = final_nodes[:2] # Берем 2 лучших

          # 2. MTPROTO (Исправленные ссылки)
          mt_data = get_web("https://t.me/s/ProxyMTProto") + get_web("https://t.me/s/TelMTProto")
          mt_links = list(dict.fromkeys(re.findall(r"(tg://proxy\?server=[^\s\"'<>]+)", mt_data)))
          random.shuffle(mt_links)
          mt_res = mt_links[:5]

          # 3. HTTP/S
          h_data = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_res = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_data)))[:5]

          msg = "💎 **PROX-Y TOTAL REFRESH** 💎\n\n"
          
          msg += "🌐 **HTTP/S:**\n"
          msg += "\n".join([f"`{p}`" for p in h_res]) if h_res else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (v2rayNG):**\n"
          if v_res:
              for i, node in enumerate(v_res):
                  msg += f"🔥 Node {i+1}:\n`{node}`\n\n"
          else:
              # Если совсем глухо, даем ссылку на работающий канал
              msg += "⚠️ Все ключи перегружены. [Взять тут](https://t.me/v2rayng_v)\n\n"

          msg += "🛡 **MTPROTO (Telegram Links):**\n"
          for i, link in enumerate(mt_res):
              msg += f"🔹 [Connect Proxy {i+1}]({link})\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
