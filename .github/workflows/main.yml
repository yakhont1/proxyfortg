name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import base64

          def get_raw(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  # Сократили таймаут до 5 секунд, чтобы не ждать по 10 минут
                  with urllib.request.urlopen(req, timeout=5) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - быстрый API (5 штук)
          h_data = get_raw("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000")
          h_list = re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw if 'h_raw' in locals() else h_data)[:20]
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS / VMESS - берем из одного, но очень жирного и быстрого источника
          v_raw = get_raw("https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt")
          if v_raw and not v_raw.startswith("vless"):
              try: v_raw = base64.b64decode(v_raw).decode('utf-8')
              except: pass
          
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#\"<]+|vmess://[^\s#\"<]+|ss://[^\s#\"<]+)", v_raw)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - только рабочие агрегаторы
          m_all = get_raw("https://raw.githubusercontent.com/discord-is-cool/mtproto-proxy-list/main/proxies.txt")
          m_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+(?:\&[^\s&\"']+)*", m_all)))
          random.shuffle(m_list)
          m_final = m_list[:5]

          msg = "⚡️ **FAST PROXY UPDATE** ⚡️\n\n"
          msg += "🌐 **HTTP/S:**\n" + "\n".join([f"`{p}`" for p in h_final]) + "\n\n"
          
          msg += "🔐 **VLESS / VMESS:**\n"
          if v_final:
              for i, l in enumerate(v_final): msg += f"🚀 Node {i+1}:\n`{l[:50]}...` \n[🔗 LINK]({l})\n\n"
          else: msg += "⚠️ Обновление узлов...\n\n"

          msg += "🛡 **MTPROTO:**\n"
          if m_final:
              for i, l in enumerate(m_final): msg += f"🔹 [Proxy {i+1}]({l})\n"
          else: msg += "🔹 [Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
