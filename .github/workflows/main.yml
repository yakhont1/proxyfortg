name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import requests, os, re
          def get_d(urls, limit=5):
              combined = []
              for u in urls:
                  try:
                      r = requests.get(u, timeout=15)
                      if r.status_code == 200:
                          lines = [l.strip() for l in r.text.splitlines() if len(l) > 15]
                          combined.extend(lines)
                  except: pass
              return list(dict.fromkeys(combined))[:limit]

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          
          # Источники
          h = get_d(["https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt", "https://raw.githubusercontent.com/ShiftyTR/Proxy-List/master/http.txt"], 8)
          v = get_d(["https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt", "https://raw.githubusercontent.com/V2RAY-CONFIG/V2RAY-CONFIG/main/All_Configs_Sub.txt"], 5)
          m = get_d(["https://raw.githubusercontent.com/FidS6/MTProto-Proxy/main/mtproto.txt"], 5)

          msg = "💎 **PREMIUM PROXY BUNDLE** 💎\n\n"
          msg += "🌐 **HTTP/S (Tap to copy):**\n" + "\n".join([f"`{p}`" for p in h]) + "\n\n"
          
          msg += "🔐 **VLESS/V2RAY (Tap to copy):**\n"
          if v:
              for i, link in enumerate(v): msg += f"🔗 Config {i+1}:\n`{link}`\n\n"
          else: msg += "Searching for nodes...\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if m:
              for i, proxy in enumerate(m): msg += f"🔹 [Proxy {i+1}]({proxy})\n"
          else:
              msg += "🔗 [Default Proxy](https://t.me/proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", 
                        data={"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": True})
        shell: python
