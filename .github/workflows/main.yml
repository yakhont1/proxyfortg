name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                      'Referer': 'https://openkeys.net/'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP/S - Стандартный список
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_final = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))[:5]

          # 2. VLESS & TROJAN - Твои любимые источники
          sources = [
              "https://openkeys.net/protocols/vless/",
              "https://freevpnkeys.com/vless/",
              "https://t.me/s/v2rayng_v",
              "https://sub.shz.al/v2ray"
          ]
          
          all_data = "".join([get_web(s) for s in sources])
          # Ищем VLESS и Trojan ссылки
          found = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", all_data)
          
          clean_nodes = []
          for link in found:
              # Убираем HTML-мусор, который мы видели на скриншотах
              res = re.split(r'[<>"\'\s]', link)[0]
              if len(res) > 80:
                  clean_nodes.append(res)

          final_nodes = list(dict.fromkeys(clean_nodes))
          random.shuffle(final_nodes)
          final_nodes = final_nodes[:2] # Строго 2 ключа

          # 3. MTPROTO
          m_all = get_web("https://t.me/s/ProxyMTProto")
          mt_final = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+", m_all)))[:5]

          msg = "🚀 **V2RAYNG ULTIMATE PACK** 🚀\n\n"
          
          msg += "🌐 **HTTP/S (Fresh):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (Top 2):**\n"
          if final_nodes:
              for i, node in enumerate(final_nodes):
                  msg += f"🔥 Node {i+1}:\n`{node}`\n\n"
          else:
              msg += "⚠️ Ключи обновляются на сервере...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          for i, link in enumerate(mt_final):
              msg += f"🔹 [Connect Proxy {i+1}]({link})\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
