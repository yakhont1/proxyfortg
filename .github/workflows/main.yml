name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi-File Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # 1. Задаем базовый номер (от которого пойдем вниз)
          # На текущий момент 216 - это база, пойдем до 200
          START_NUM=216
          ALL_V_LINKS=""

          echo "Starting harvest from sub${START_NUM}.txt downwards..."

          # 2. Собираем конфиги (тихо игнорируя ошибки 404)
          for i in $(seq $START_NUM -1 $((START_NUM-15))); do
            URL="https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/configs/sub${i}.txt"
            # Используем -f чтобы curl выдавал ошибку молча, и --retry для стабильности
            CONTENT=$(curl -sL -f "$URL" || echo "")
            
            if [ ! -z "$CONTENT" ]; then
              # Вытаскиваем только валидные ссылки
              LINKS=$(echo "$CONTENT" | grep -E '^(vless|vmess|trojan|ss)://')
              ALL_V_LINKS="${ALL_V_LINKS}${LINKS}"$'\n'
              echo "Collected links from sub${i}.txt"
            fi
          done

          # 3. Чистим дубликаты и выбираем 2 случайных из всей кучи
          FINAL_V=$(echo "$ALL_V_LINKS" | grep . | sort -u | shuf -n 2)

          # 4. MTProto (берем из публичных превью каналов)
          MT_LINKS=$(curl -sL "https://t.me/s/ProxyMTProto" | grep -oP 'tg://proxy\?server=[^"&<> ]+' | shuf -n 3 || echo "")

          # Формируем текст сообщения
          MSG="🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐%0A%0A"
          MSG="${MSG}⚡️ **V2RAY NODES (VLESS / VMESS)**%0A"
          MSG="${MSG}*Fresh nodes from premium subscription pool*%0A"
          MSG="${MSG}*Свежие узлы из пула платных подписок*%0A%0A"

          if [ ! -z "$FINAL_V" ]; then
            count=1
            while read -r line; do
              # Экранируем спецсимволы для Markdown если нужно, но для конфигов лучше оставить в ` `
              MSG="${MSG}🚀 Node $count:%0A\`$line\`%0A%0A"
              count=$((count+1))
            done <<< "$FINAL_V"
          else
            MSG="${MSG}⚠️ Nodes rotation... / Узлы обновляются...%0A%0A"
          fi

          MSG="${MSG}🔒 **MTPROTO (Telegram Direct)**%0A"
          if [ ! -z "$MT_LINKS" ]; then
            count=1
            while read -r line; do
              MSG="${MSG}🔹 [Secure Access $count]($line)%0A"
              count=$((count+1))
            done <<< "$MT_LINKS"
          fi

          MSG="${MSG}%0A✨ **Status:** \`Operational / Работает\`%0A"
          MSG="${MSG}🕒 **Update:** \`Every 2 hours / Каждые 2 часа\`"

          # 5. Отправка (с проверкой успешности самой отправки)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
