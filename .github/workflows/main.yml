name: Update Proxy

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_web(url):
              try:
                  # Добавили имитацию реального браузера (Headers), чтобы сайты не блокировали GitHub
                  req = urllib.request.Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36',
                      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                      'Accept-Language': 'en-US,en;q=0.5'
                  })
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP/S
          h_raw = get_web("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http")
          h_final = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))[:5]

          # 2. VLESS & TROJAN (Расширенный поиск)
          # Добавили источники, которые гарантированно отдают текст без JavaScript
          v_sources = [
              "https://sub.shz.al/v2ray", 
              "https://vless.at.ua/index/0-2",
              "https://t.me/s/v2rayng_v",
              "https://t.me/s/v2ray_outline_vless",
              "https://openkeys.net/protocols/vless/"
          ]
          
          v_combined = ""
          for s in v_sources:
              v_combined += get_web(s)
          
          # Ищем ключи vless и trojan
          raw_links = re.findall(r"((?:vless|trojan)://[^\s<\"'#]+)", v_combined)
          
          v_clean = []
          for link in raw_links:
              # Очистка от мусора
              clean = re.split(r'[<>"\'\s]', link)[0]
              if len(clean) > 80:
                  v_clean.append(clean)

          v_final = list(dict.fromkeys(v_clean))
          random.shuffle(v_final)
          v_final = v_final[:2] # Ограничение: 2 ключа

          # 3. MTPROTO
          m_urls = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          m_all = "".join([get_web(u) for u in m_urls])
          mt_final = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&\"']+", m_all)))[:5]

          # Формирование сообщения
          msg = "🛰 **FINAL SURVIVAL REFRESH** 🛰\n\n"
          
          msg += "🌐 **HTTP/S (Working):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Offline"

          msg += "\n\n🔐 **VLESS / TROJAN (Top 2):**\n"
          if v_final:
              for i, node in enumerate(v_final):
                  msg += f"🔥 Node {i+1}:\n`{node}`\n\n"
          else:
              # Если все еще пусто, берем жестко зашитый резерв из TG зеркала
              msg += "⚠️ Ключи в очереди на парсинг. Проверьте через 5 минут.\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Proxy {i+1}]({link})\n"
          else:
              msg += "🔹 [Emergency Backup](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
