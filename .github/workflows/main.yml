name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random
          import time

          def get_data(url):
              try:
                  # Используем разные User-Agent для каждого запроса
                  ua = f"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 {random.random()}"
                  req = urllib.request.Request(url, headers={'User-Agent': ua})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - используем Proxyscrape API (работает стабильно)
          h_raw = get_data("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_raw)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS/VMESS - парсим через зеркала агрегаторов
          v_sources = [
              "https://sub.shz.al/v2ray", # Внешнее зеркало-агрегатор
              "https://raw.githubusercontent.com/freev2rayspeed/v2ray/main/v2ray.txt"
          ]
          v_all = ""
          for s in v_sources: v_all += get_data(s)
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+)", v_all)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - используем альтернативный живой источник
          m_raw = get_data("https://raw.githubusercontent.com/soroushmirzaei/telegram-proxies/main/proxies")
          m_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*", m_raw)))
          random.shuffle(m_list)
          m_final = m_list[:5]

          msg = "🚀 **STABLE PROXY UPDATE** 🚀\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Ожидание API..."
          
          msg += "\n\n🔐 **VLESS / VMESS / SS:**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🔹 Node {i+1}:\n`{l[:55]}...` \n[🔗 LINK]({l})\n\n"
          else:
              msg += "⚠️ Поиск новых узлов...\n\n"

          msg += "🛡 **MTPROTO (Telegram):**\n"
          if m_final:
              for i, l in enumerate(m_final): msg += f"🔹 [Connect Proxy {i+1}]({l})\n"
          else:
              msg += "🔹 [Emergency Proxy](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
