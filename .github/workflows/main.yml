name: Update Proxy

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Run logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import re
          import os
          import random

          def get_raw(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.read().decode('utf-8', errors='ignore')
              except: return ""

          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')

          # 1. HTTP - Берем из надежного API (ровно 5)
          h_data = get_raw("https://api.proxyscrape.com/v2/?request=getproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all")
          h_list = list(dict.fromkeys(re.findall(r"\d+\.\d+\.\d+\.\d+:\d+", h_data)))
          random.shuffle(h_list)
          h_final = h_list[:5]

          # 2. VLESS/VMESS - Используем новый агрегатор
          v_data = get_raw("https://raw.githubusercontent.com/vfarid/v2ray-worker-sub/master/sub/shadowrocket")
          v_list = list(dict.fromkeys(re.findall(r"(vless://[^\s#]+|vmess://[^\s#]+|ss://[^\s#]+)", v_data)))
          random.shuffle(v_list)
          v_final = v_list[:5]

          # 3. MTPROTO - Берем из альтернативной базы
          m_data = get_raw("https://raw.githubusercontent.com/mizane-mize/MTProto/main/MTProto.txt")
          m_list = list(dict.fromkeys(re.findall(r"tg://proxy\?server=[^\s&]+(?:\&[^\s&]+)*", m_data)))
          random.shuffle(m_list)
          m_final = m_final = m_list[:5]

          msg = "🔥 **NEW PROXY UPDATE** 🔥\n\n"
          
          msg += "🌐 **HTTP/S (Random 5):**\n"
          msg += "\n".join([f"`{p}`" for p in h_final]) if h_final else "❌ Обновление..."
          
          msg += "\n\n🔐 **VLESS / VMESS (Top 5):**\n"
          if v_final:
              for i, l in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{l[:60]}...` \n[👉 Копировать ссылку]({l})\n\n"
          else:
              msg += "⚠️ Конфиги скоро появятся...\n\n"

          msg += "🛡 **MTPROTO (Telegram 5):**\n"
          if m_final:
              for i, l in enumerate(m_final):
                  msg += f"🔹 [Прокси сервер {i+1}]({l})\n"
          else:
              msg += "🔹 [Запасной вариант](tg://proxy?server=proxy.digitalresistance.dog&port=443&secret=ddd41d8cd98f00b204e9800998ecf8427e)\n"

          # Отправка
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
