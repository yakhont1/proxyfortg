name: Global Proxy Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run Multi-Source Proxy Logic
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          import urllib.request
          import urllib.parse
          import re
          import os
          import random
          import time
          import html

          # 1. Сбор свежих SOCKS5 (4 штуки)
          sources = [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt",
              "https://raw.githubusercontent.com/hookzof/socks5_list/master/proxy.txt",
              "https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-socks5.txt"
          ]

          fresh_pool = []
          for url in sources:
              try:
                  req = urllib.request.Request(url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      content = r.read().decode('utf-8').splitlines()
                      clean_lines = [l.strip() for l in content if l.strip() and ":" in l]
                      fresh_pool.extend(clean_lines[:15])
              except Exception as e:
                  print(f"Error fetching SOCKS5: {e}")

          fresh_pool = list(dict.fromkeys(fresh_pool))
          v_final = []
          if fresh_pool:
              count_to_take = min(4, len(fresh_pool))
              v_final = random.sample(fresh_pool, count_to_take)

          # 2. Умный сбор MTProto (Парсим даже перенесённые строки)
          mt_final = []
          raw_mt_links = []
          mt_sources = ["https://t.me/s/ProxyMTProto", "https://t.me/s/TelMTProto"]
          
          for web_url in mt_sources:
              try:
                  req = urllib.request.Request(web_url + f"?t={int(time.time())}", headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      # Декодируем весь HTML страницы
                      web_data = html.unescape(r.read().decode('utf-8'))
                      
                      # Шаг А: Сначала забираем готовые ссылки из кнопок "Connect", если они там есть
                      button_links = re.findall(r'tg://proxy\?server=[^\s"\'<>]+', web_data)
                      for bl in button_links:
                          raw_mt_links.append(bl.strip())
                      
                      # Шаг Б: Разрезаем страницу на отдельные блоки сообщений, чтобы не путать данные разных постов
                      posts = re.findall(r'<div class="tgme_widget_message_text[^">]*">(.*?)</div>', web_data, re.DOTALL)
                      
                      for post in posts:
                          # Убираем HTML теги внутри текста поста для чистого поиска
                          clean_post = re.sub(r'<[^>]+>', ' ', post)
                          
                          # Ищем переменные (игнорируем регистр)
                          server_match = re.search(r'(?:Server|Сервер)\s*:\s*([a-zA-Z0-9\.\-_]+)', clean_post, re.IGNORECASE)
                          port_match = re.search(r'(?:Port|Порт)\s*:\s*([0-9]+)', clean_post, re.IGNORECASE)
                          # Секрет ищем жадно, захватывая возможные переносы строк и пробелы до конца блока или ключевых слов
                          secret_match = re.search(r'(?:Secret|Секрет)\s*:\s*([a-zA-Z0-9\+=\-_ \s\n\r]+)', clean_post, re.IGNORECASE)
                          
                          if server_match and port_match and secret_match:
                              srv = server_match.group(1).strip()
                              prt = port_match.group(1).strip()
                              
                              # Очищаем секрет от абсолютно всех пробелов, переносов строк и мусора
                              sec = secret_match.group(1).split('@')[0] # отсекаем юзернейм канала, если он прилип
                              sec = re.sub(r'[\s\n\r]', '', sec).strip()
                              
                              # Фильтруем только валидные секреты (длина от 10 символов, чтобы не взять мусор)
                              if len(sec) >= 10:
                                  # Кодируем секрет для безопасной передачи в URL (важно для знаков "==")
                                  encoded_sec = urllib.parse.quote(sec)
                                  constructed_link = f"tg://proxy?server={srv}&port={prt}&secret={encoded_sec}"
                                  raw_mt_links.append(constructed_link)
              except Exception as e:
                  print(f"Error parsing MTProto text: {e}")

          # Фильтруем дубликаты
          seen_mt = set()
          clean_mt = []
          for link in raw_mt_links:
              if link not in seen_mt and "secret=" in link:
                  seen_mt.add(link)
                  clean_mt.append(link)

          # Свежие посты находятся внизу веб-страницы, переворачиваем список, чтобы они стали первыми
          clean_mt.reverse()
          mt_final = clean_mt[:5]

          # 3. Формируем сообщение
          msg = "🌐 **PROXY NETWORK UPDATE | ОБНОВЛЕНИЕ СЕТИ** 🌐\n\n"
          
          msg += "⚡️ **SOCKS5 NODES (Universal)**\n"
          msg += "Tap to copy individual node\n"
          msg += "Нажмите, чтобы скопировать ключ\n"
          
          if v_final:
              for i, proxy in enumerate(v_final):
                  msg += f"🚀 Node {i+1}:\n`{proxy}`\n\n"
          else:
              msg += "⚠️ *Nodes rotation... / Узлы обновляются...*\n\n"

          msg += "🔒 **MTPROTO (Telegram Direct)**\n"
          msg += "**Stable access / Стабильный доступ**\n"
          
          if mt_final:
              for i, link in enumerate(mt_final):
                  msg += f"🔹 [Secure Access {i+1} | Подключить]({link})\n"
          else:
              msg += "⚠️ *MTProto rotation... / Прокси обновляются...*\n"
          
          msg += "\n✨ **Status:** `Operational / Работает`\n"
          msg += "🕒 **Update:** `Every 2 hours / Каждые 2 часа`"

          # 4. Отправка в Telegram
          t, c = os.getenv('TELEGRAM_TOKEN'), os.getenv('CHAT_ID')
          params = urllib.parse.urlencode({"chat_id": c, "text": msg, "parse_mode": "Markdown", "disable_web_page_preview": "True"}).encode()
          urllib.request.urlopen(f"https://api.telegram.org/bot{t}/sendMessage", data=params)
        shell: python
